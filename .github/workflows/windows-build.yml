name: Windows development bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Extract project source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath HTTP-Capture-Source.zip -DestinationPath .
          Copy-Item -LiteralPath fixes/apps/capture_app/lib/app.dart -Destination http-capture/apps/capture_app/lib/app.dart
          Copy-Item -LiteralPath fixes/apps/capture_app/lib/platform/desktop_engine.dart -Destination http-capture/apps/capture_app/lib/platform/desktop_engine.dart
          Copy-Item -LiteralPath fixes/engines/desktop_proxy/src/capture_proxy/main.py -Destination http-capture/engines/desktop_proxy/src/capture_proxy/main.py
          Copy-Item -LiteralPath fixes/engines/desktop_proxy/src/capture_proxy/windows_adapter.py -Destination http-capture/engines/desktop_proxy/src/capture_proxy/windows_adapter.py
          Copy-Item -LiteralPath fixes/scripts/smoke_packaged.py -Destination http-capture/scripts/smoke_packaged.py
          Copy-Item -LiteralPath build_desktop.py -Destination http-capture/scripts/build_desktop.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.5'
          cache: true
      - name: Build, test and package Windows x64
        shell: pwsh
        working-directory: http-capture
        run: python scripts/build_desktop.py windows
      - name: Upload unsigned development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HTTP-Capture-Windows-x64-unsigned
          path: http-capture/dist/HTTP-Capture-Windows.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            http-capture/.build/pyinstaller/**/warn-*.txt
            http-capture/dist/HTTP-Capture-Windows/resources/*.json
          if-no-files-found: ignore
          retention-days: 7
