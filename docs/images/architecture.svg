<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="HTTP Capture architecture: platform engines and shared Dart core"><title>HTTP Capture architecture: platform engines and shared Dart core</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#6c8299"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><text x="46" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#153451" font-weight="700">HTTP Capture / architecture</text><text x="46" y="93" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">Platform-specific collection. Shared session storage and file export.</text><rect x="40" y="125" width="665" height="405" rx="14" fill="#eaf2fc" stroke="#d9e3ed"/><rect x="735" y="125" width="665" height="405" rx="14" fill="#e8f5f0" stroke="#d9e3ed"/><text x="62" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#2463a0" font-weight="700">WINDOWS + macOS</text><text x="757" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#167b63" font-weight="700">ANDROID</text><rect x="62" y="182" width="620" height="75" rx="14" fill="white" stroke="#d9e3ed"/><text x="80" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#153451" font-weight="700">Proxy-aware browser / app</text><text x="80" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">OS HTTP/HTTPS proxy → 127.0.0.1:8877</text><rect x="757" y="182" width="620" height="75" rx="14" fill="white" stroke="#d9e3ed"/><text x="775" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#153451" font-weight="700">Proxy-aware app</text><text x="775" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">VpnService advertises a temporary HTTP proxy</text><path d="M370 260 L370 284" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 260 L1065 284" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="62" y="290" width="620" height="100" rx="14" fill="white" stroke="#d9e3ed"/><text x="80" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#153451" font-weight="700">Python / mitmproxy child process</text><text x="80" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">HTTP/TLS forwarding ↔ destination server</text><text x="80" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">OS adapters: WinINet + user CA / networksetup + Keychain</text><rect x="757" y="290" width="620" height="100" rx="14" fill="white" stroke="#d9e3ed"/><text x="775" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#153451" font-weight="700">Dart local HTTP/TLS proxy</text><text x="775" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">HTTP/TLS forwarding ↔ destination server</text><text x="775" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">Kotlin bridge: VPN lifecycle + Android Keystore CA</text><path d="M370 393 L370 416" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 393 L1065 416" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="62" y="422" width="620" height="78" rx="14" fill="white" stroke="#d9e3ed"/><text x="80" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#153451" font-weight="700">Shared desktop Flutter UI</text><text x="80" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">Local stdio JSON commands and session events</text><rect x="757" y="422" width="620" height="78" rx="14" fill="white" stroke="#d9e3ed"/><text x="775" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#153451" font-weight="700">Android Flutter UI</text><text x="775" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#52657a" font-weight="400">In-process Dart events + Kotlin MethodChannel</text><path d="M370 503 L370 555" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><path d="M1065 503 L1065 555" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="560" width="1360" height="112" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="65" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">SHARED DART LAYER  ·  packages/capture_core</text><text x="65" y="626" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">CaptureSession → request / response / ordered header entries / body references</text><text x="65" y="652" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">SessionStore: SQLite metadata + body files on the local device</text><path d="M720 675 L720 703" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="710" width="1360" height="140" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="65" y="747" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">SHARED DART EXPORT  ·  packages/capture_export</text><rect x="65" y="770" width="620" height="55" rx="14" fill="#eef4fb" stroke="#d9e3ed"/><text x="86" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">SAZ: ZIP + raw request/response + session XML</text><rect x="715" y="770" width="655" height="55" rx="14" fill="#eef4fb" stroke="#d9e3ed"/><text x="736" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">HAR 1.2: entries + bodies + capture extensions</text><rect x="40" y="880" width="1360" height="120" rx="14" fill="#fff8e9" stroke="#e6d4ab"/><text x="64" y="914" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#835c17" font-weight="700">BOUNDARIES</text><text x="64" y="944" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Not a full TCP/UDP packet sniffer. Proxy bypasses, pinned TLS and unsupported protocols can be missed.</text><text x="64" y="971" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Local capture/storage; user-directed export may choose another destination. No iOS standalone engine.</text></svg>