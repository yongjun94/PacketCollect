name: Android capture preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-fixes/**', 'android-native/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Prepare complete project and Android runner
        run: |
          unzip -q HTTP-Capture-Source.zip
          cp -R fixes/. http-capture/
          cd http-capture/apps/capture_app
          flutter create --platforms android --org dev.httpcapture --project-name capture_app --no-pub .
          cd ../../..
          cp -R android-fixes/. http-capture/
          cp android-native/AndroidManifest.xml http-capture/apps/capture_app/android/app/src/main/AndroidManifest.xml
          cp android-native/*.kt http-capture/apps/capture_app/android/app/src/main/kotlin/dev/httpcapture/capture_app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('http-capture/apps/capture_app/android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 29').replace('applicationId = "dev.httpcapture.capture_app"','applicationId = "dev.httpcapture.capture_app.https"')
          s += '\ndependencies { implementation("org.bouncycastle:bcpkix-jdk15to18:1.86") }\n'
          p.write_text(s)
          PY
      - name: Analyze and run HTTP proxy integration tests
        working-directory: http-capture/apps/capture_app
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/android_app.dart lib/platform/local_proxy_engine.dart test/local_proxy_test.dart
          flutter analyze
          flutter test --reporter expanded
      - name: Build installable debug APK
        working-directory: http-capture/apps/capture_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HTTP-Capture-Android-preview
          path: http-capture/apps/capture_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Start API35 emulator and exercise real Android proxy flow
        timeout-minutes: 15
        run: |
          sudo rm -rf /usr/share/dotnet "$ANDROID_HOME/ndk"
          rm -rf "$HOME/.gradle/caches" http-capture/apps/capture_app/build/app/intermediates
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/capture-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name capture-test --device pixel_6 --path "$ANDROID_AVD_HOME/capture-test.avd" --package "system-images;android-35;google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/capture-test.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/capture-test.avd" > "$ANDROID_AVD_HOME/capture-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd capture-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          timeout 120 adb wait-for-device || { cat emulator.log; exit 1; }
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          adb shell input keyevent 82
          python3 android-scripts/android_device_smoke.py
      - name: Device diagnostics
        if: always()
        run: timeout 10 "$ANDROID_HOME/platform-tools/adb" logcat -d > android-logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-test-diagnostics
          path: |
            android-device-smoke.json
            android-logcat.txt
            emulator.log
            capture-ui.xml
          if-no-files-found: ignore
