<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-label="HTTP Capture desktop architecture: Windows and macOS"><title>HTTP Capture desktop architecture: Windows and macOS</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#6c8299"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><text x="46" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#153451" font-weight="700">HTTP Capture / desktop architecture</text><text x="46" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">Windows x64 + Apple Silicon macOS. Mobile development discontinued.</text><rect x="40" y="130" width="1360" height="110" rx="14" fill="#eaf2fc" stroke="#d9e3ed"/><text x="65" y="169" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">PROXY-AWARE DESKTOP BROWSER / APP</text><text x="65" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">OS HTTP/HTTPS proxy -&gt; 127.0.0.1:8877 -&gt; destination via mitmproxy</text><path d="M720 245 L720 275" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="280" width="1360" height="130" rx="14" fill="white" stroke="#d9e3ed"/><text x="65" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">BUNDLED PYTHON / MITMPROXY ENGINE</text><text x="65" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">Windows: WinINet + current-user CA | macOS: networksetup + Keychain</text><text x="65" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">Forwards requests/responses; writes body files and emits session events.</text><path d="M720 415 L720 445" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="450" width="1360" height="108" rx="14" fill="white" stroke="#d9e3ed"/><text x="65" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">SHARED FLUTTER DESKTOP UI + LOCAL STDIO JSON IPC</text><text x="65" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">Start / Pause / Stop / settings / session inspection / export</text><path d="M720 563 L720 593" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="598" width="1360" height="108" rx="14" fill="white" stroke="#d9e3ed"/><text x="65" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">CAPTURE CORE / packages/capture_core</text><text x="65" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">CaptureSession + SQLite metadata + local binary body files</text><path d="M720 711 L720 741" fill="none" stroke="#6c8299" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="746" width="1360" height="105" rx="14" fill="white" stroke="#d9e3ed"/><text x="65" y="785" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">CAPTURE EXPORT / packages/capture_export</text><text x="65" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#153451" font-weight="400">SAZ: ZIP + HTTP messages + XML | HAR 1.2: entries + content + timings</text><text x="46" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Data-flow schematic. Not a full TCP/UDP sniffer; app trust/proxy policies still apply.</text></svg>