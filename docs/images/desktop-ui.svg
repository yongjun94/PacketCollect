e&quot; }</text><circle cx="1110" cy="180" r="15" fill="#2463a0"/><text x="1105" y="186" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">1</text><text x="1136" y="186" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#2463a0" font-weight="700">Capture controls</text><text x="1100" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Start, pause/resume and stop.</text><text x="1100" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Export and Clear require Stop.</text><circle cx="1110" cy="320" r="15" fill="#2463a0"/><text x="1105" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">2</text><text x="1136" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#2463a0" font-weight="700">Connection state</text><text x="1100" y="359" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Listener address and session count.</text><text x="1100" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">A green status alone is not proof of traffic.</text><circle cx="1110" cy="460" r="15" fill="#2463a0"/><text x="1105" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">3</text><text x="1136" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#2463a0" font-weight="700">Session list</text><text x="1100" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Filter and choose a stored session.</text><text x="1100" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Desktop uses paged list loading.</text><circle cx="1110" cy="600" r="15" fill="#2463a0"/><text x="1105" y="606" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">4</text><text x="1136" y="606" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#2463a0" font-weight="700">Inspector</text><text x="1100" y="639" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Request / Response tabs show headers</text><text x="1100" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">and a body preview (up to 64 KiB).</text><circle cx="1110" cy="740" r="15" fill="#2463a0"/><text x="1105" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">5</text><text x="1136" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#2463a0" font-weight="700">Settings</text><text x="1100" y="779" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">Proxy port, HTTPS, CA management</text><text x="1100" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">and OS proxy controls.</text><circle cx="1034" cy="225" r="15" fill="#2463a0"/><text x="1029" y="231" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">1</text><circle cx="1034" cy="351" r="15" fill="#2463a0"/><text x="1029" y="357" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">2</text><circle cx="1034" cy="457" r="15" fill="#2463a0"/><text x="1029" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">3</text><circle cx="1034" cy="688" r="15" fill="#2463a0"/><text x="1029" y="694" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">4</text><circle cx="1041" cy="150" r="15" fill="#2463a0"/><text x="1036" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="white" font-weight="700">5</text><text x="42" y="982" font-family="DejaVu Sans,Arial,sans-serif" font-size="15"