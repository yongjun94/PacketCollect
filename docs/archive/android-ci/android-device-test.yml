name: Android device smoke
# Uses the default Android image to avoid unrelated Google service ANRs.
on:
  push:
    branches: [main]
    paths: ['.github/android-device-retest.json']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Android build run ID containing the compiled APK to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve and verify compiled APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.build_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          plan = json.loads(Path('.github/android-device-retest.json').read_text())
          run_id = os.environ.get('REQUESTED_RUN') or str(plan['build_run_id'])
          assert run_id.isdigit()
          base = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions'
          run = api(base + '/runs/' + run_id)
          assert run['path'] == '.github/workflows/android-build.yml'
          assert run['status'] == 'completed'
          if not os.environ.get('REQUESTED_RUN'):
              assert run['head_sha'] == plan['source_sha']
          jobs = api(base + '/runs/' + run_id + '/jobs')['jobs']
          steps = {s['name']: s['conclusion'] for j in jobs for s in j['steps']}
          for name in ['Analyze and run HTTP proxy integration tests', 'Build installable debug APK']:
              assert steps.get(name) == 'success', (name, steps.get(name))
          artifacts = api(base + '/runs/' + run_id + '/artifacts')['artifacts']
          matches = [a for a in artifacts if a['name'] == 'HTTP-Capture-Android-preview' and not a['expired']]
          assert len(matches) == 1
          if not os.environ.get('REQUESTED_RUN'):
              assert matches[0]['id'] == plan['artifact_id']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run_id=' + run_id + '\\n')
          print('Testing compiled APK from source', run['head_sha'])
          PY
      - name: Prepare API35 emulator at an explicit AVD path
        run: |
          sudo rm -rf /usr/share/dotnet "$ANDROID_HOME/ndk"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;default;x86_64" "emulator" "platform-tools"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/capture-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name capture-test --device pixel_6 --path "$ANDROID_AVD_HOME/capture-test.avd" --package "system-images;android-35;default;x86_64"
          test -f "$ANDROID_AVD_HOME/capture-test.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/capture-test.avd" > "$ANDROID_AVD_HOME/capture-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd capture-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: HTTP-Capture-Android-preview
          run-id: ${{ steps.apk.outputs.run_id }}
          github-token: ${{ github.token }}
          path: http-capture/apps/capture_app/build/app/outputs/flutter-apk
      - name: Exercise APK on Android
        timeout-minutes: 15
        run: |
          if [ -z "${{ inputs.build_run_id }}" ]; then
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan = json.loads(Path('.github/android-device-retest.json').read_text())
          apk = Path('http-capture/apps/capture_app/build/app/outputs/flutter-apk/app-debug.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == plan['apk_sha256']
          PY
          fi
          timeout 120 adb wait-for-device || { cat emulator.log; exit 1; }
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          python3 http-capture/scripts/android_device_smoke.py
      - name: Capture diagnostic logs
        if: always()
        run: timeout 10 "$ANDROID_HOME/platform-tools/adb" logcat -d > android-logcat.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-device-smoke-result
          path: |
            android-device-smoke.json
            android-logcat.txt
            emulator.log
          if-no-files-found: ignore
