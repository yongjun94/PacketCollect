<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="Android interface schematic and capture setup walkthrough"><title>Android interface schematic and capture setup walkthrough</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#6c8299"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><text x="42" y="56" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#153451" font-weight="700">Android UI / capture workflow</text><text x="42" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#52657a" font-weight="400">A separate mobile screen; the session model and exporters remain shared.</text><rect x="55" y="125" width="455" height="805" rx="30" fill="#fff" stroke="#b9c9d9"/><rect x="76" y="148" width="414" height="62" rx="14" fill="#e8f3ef" stroke="#d9e3ed"/><text x="95" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#153451" font-weight="700">HTTP Capture · HTTPS Preview</text><text x="95" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#167b63" font-weight="600">Stopped · VPN proxy released</text><text x="95" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#52657a" font-weight="400">HTTP + optional HTTPS decryption</text><text x="95" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#52657a" font-weight="400">for all proxy-aware hosts.</text><text x="95" y="333" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#52657a" font-weight="400">Switching apps keeps capture active.</text><text x="95" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#52657a" font-weight="400">Temporary VPN proxy only.</text><text x="95" y="402" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#52657a" font-weight="400">Wi-Fi proxy settings stay unchanged.</text><text x="95" y="426" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#52657a" font-weight="400">Proxy-aware apps only; replaces</text><text x="95" y="450" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#52657a" font-weight="400">an existing VPN connection.</text><rect x="95" y="484" width="106" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="112" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">Licenses</text><rect x="212" y="484" width="126" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="229" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">HTTPS on</text><rect x="348" y="484" width="111" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="365" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">Test TLS</text><rect x="95" y="539" width="106" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="112" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">Start</text><rect x="212" y="539" width="106" height="40" rx="18" fill="#f2f4f6" stroke="#d9e3ed"/><text x="229" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#8794a4" font-weight="600">Pause</text><rect x="330" y="539" width="129" height="40" rx="18" fill="#f2f4f6" stroke="#d9e3ed"/><text x="347" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#8794a4" font-weight="600">Test HTTP</text><rect x="95" y="594" width="106" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="112" y="620" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">SAZ</text><rect x="212" y="594" width="106" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="229" y="620" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">HAR</text><rect x="330" y="594" width="129" height="40" rx="18" fill="#e8f0fa" stroke="#d9e3ed"/><text x="347" y="620" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#2463a0" font-weight="600">Clear</text><text x="95" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#2463a0" font-weight="400">Wi-Fi settings · legacy proxy cleanup</text><rect x="95" y="698" width="364" height="39" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="110" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#52657a" font-weight="400">Filter method, URL, status</text><text x="100" y="756" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#153451" font-weight="700">GET 200</text><text x="100" y="782" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">https://example.test/</text><path d="M95 796 L460 796" fill="none" stroke="#6c8299" stroke-width="2"/><text x="100" y="828" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#153451" font-weight="700">POST 200</text><text x="100" y="854" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#52657a" font-weight="400">https://api.example.test/items</text><path d="M95 868 L460 868" fill="none" stroke="#6c8299" stroke-width="2"/><rect x="555" y="135" width="600" height="155" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="580" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">1  Prepare HTTPS trust</text><text x="580" y="204" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Open HTTPS settings and opt in.</text><text x="580" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Save the public CA and complete Android’s</text><text x="580" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">system CA installation with user approval.</text><rect x="555" y="320" width="600" height="155" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="580" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">2  Start capture</text><text x="580" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Approve the VPN request.</text><text x="580" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Only proxy-aware traffic is redirected;</text><text x="580" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">this is not a full packet-processing VPN.</text><rect x="555" y="505" width="600" height="155" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="580" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">3  Use the target app</text><text x="580" y="574" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Open another app and trigger a request.</text><text x="580" y="602" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Switching apps does not stop capture.</text><text x="580" y="630" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Some apps ignore proxies or reject user CAs.</text><rect x="555" y="690" width="600" height="155" rx="14" fill="#fff" stroke="#d9e3ed"/><text x="580" y="725" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#2463a0" font-weight="700">4  Stop and export</text><text x="580" y="759" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Stop releases the VPN proxy first.</text><text x="580" y="787" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">SAZ / HAR use the shared Dart exporters.</text><text x="580" y="815" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">The system document picker saves the file.</text><text x="555" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#52657a" font-weight="400">Session details: URL, state, headers and body size.</text><text x="42" y="982" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#52657a" font-weight="400">DOCUMENTATION SCHEMATIC · synthetic sessions · text abbreviated for readability · not a runtime screenshot</text></svg>