name: macOS Apple Silicon preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['macos-fixes/**', '.github/workflows/macos-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Extract source and platform fixes
        run: |
          test "$(uname -m)" = arm64
          unzip -q HTTP-Capture-Source.zip
          cp -R fixes/. http-capture/
          cp -R macos-fixes/. http-capture/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.35.5'
          architecture: arm64
          cache: true
      - name: Test proxy safety without changing runner settings
        run: python -m unittest discover -s http-capture/tests/unit -p test_macos_proxy.py -v
      - name: Build, test and package native app
        working-directory: http-capture
        run: python scripts/build_desktop.py macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HTTP-Capture-macOS-arm64-preview
          path: http-capture/dist/HTTP-Capture-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-build-diagnostics
          path: |
            http-capture/.build/pyinstaller/**/warn-*.txt
            http-capture/dist/HTTP-Capture.app/Contents/Resources/resources/*.json
          if-no-files-found: ignore
